name: Auto Update Crypto News

on:
  schedule:
    - cron: '0 * * * *'  # Се извршува на секој 1 час
  workflow_dispatch:      # Дозволува рачно пуштање од GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/python-version@v5
        with:
          python-version: '3.x'

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Auto-update crypto news [skip ci]" || exit 0
          git push
