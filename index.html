<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- 📊 Google Tag Manager -->
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-W3N2995X"></script>
    <script>

      gtag('js', new Date());

    <!-- 📊 Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-J221H3KZR5"></script>
    <script>
      gtag('config', 'G-J221H3KZR5');
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoFun24 - Live Crypto News & Market Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --modal-bg: rgba(15, 23, 42, 0.9);
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --accent-color: #0284c7;
            --border-color: #e2e8f0;
            --modal-bg: rgba(248, 250, 252, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 2rem;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .widget-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .news-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .news-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
            transition: transform 0.2s, border-color 0.2s;
        }

        .news-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background-color: var(--border-color);
        }

        .news-content-box {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .news-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--text-color);
        }

        .news-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Modal Reader Styling */
        .reader-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-bg);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .reader-modal.active {
            display: flex;
        }

        .reader-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            max-width: 750px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 2.5rem;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .close-btn {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            background: var(--border-color);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background-color: var(--accent-color);
            color: #fff;
        }

        .reader-img {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 1.5rem;
        }

        .reader-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.75rem;
        }

        .reader-body {
            margin-top: 1.5rem;
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-color);
            white-space: pre-line;
        }

        .external-link {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.75rem 1.5rem;
            background-color: var(--accent-color);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }

        .external-link:hover {
            opacity: 0.9;
        }

        .ad-container {
            margin: 1.5rem 0;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ CryptoFun24</div>
        <button class="theme-toggle" id="themeToggle">☀️ Light Mode</button>
    </header>

    <div class="container">
        <main>
            <!-- A-ADS Реклама горе -->
            <div class="ad-container">
                <div style="width: 100%; margin: auto; position: relative; z-index: 99998;">
                    <iframe data-aa='2461290' src='//acceptable.a-ads.com/2461290/?size=Adaptive' style='border:0; padding:0; width:70%; height:auto; overflow:hidden; display: block; margin: auto'></iframe>
                </div>
            </div>

            <h2 style="margin-bottom: 1.5rem;">Live Crypto News</h2>
            <div class="news-grid" id="newsGrid">
                <p>Loading news...</p>
            </div>
        </main>

        <aside>
            <div class="widget-card">
                <h3>Live Market</h3>
                <div id="cryptoPrices" style="margin-top: 1rem;">
                    Loading market...
                </div>
            </div>

            <!-- A-ADS Реклама во страничен дел -->
            <div class="widget-card">
                <div style="width: 100%; margin: auto; position: relative; z-index: 99998;">
                    <iframe data-aa='2461290' src='//acceptable.a-ads.com/2461290/?size=Adaptive' style='border:0; padding:0; width:100%; height:auto; overflow:hidden; display: block; margin: auto'></iframe>
                </div>
            </div>
        </aside>
    </div>

    <!-- Модал читач -->
    <div class="reader-modal" id="readerModal">
        <div class="reader-content">
            <button class="close-btn" id="closeReader">&times;</button>
            
            <div class="ad-container">
                <div style="width: 100%; margin: auto; position: relative; z-index: 99998;">
                    <iframe data-aa='2461290' src='//acceptable.a-ads.com/2461290/?size=Adaptive' style='border:0; padding:0; width:80%; height:auto; overflow:hidden; display: block; margin: auto'></iframe>
                </div>
            </div>

            <img id="readerImg" class="reader-img" src="" alt="Article Image">
            <h1 class="reader-title" id="readerTitle"></h1>
            <div class="news-meta" id="readerMeta"></div>
            <div class="reader-body" id="readerBody"></div>
            
            <div class="ad-container">
                <div style="width: 100%; margin: auto; position: relative; z-index: 99998;">
                    <iframe data-aa='2461290' src='//acceptable.a-ads.com/2461290/?size=Adaptive' style='border:0; padding:0; width:80%; height:auto; overflow:hidden; display: block; margin: auto'></iframe>
                </div>
            </div>

            <a href="#" target="_blank" class="external-link" id="readerExternal">Read Original Source ↗</a>
        </div>
    </div>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'dark';

        if (currentTheme === 'light') {
            document.body.setAttribute('data-theme', 'light');
            themeToggle.textContent = '🌙 Dark Mode';
        }

        themeToggle.addEventListener('click', () => {
            let theme = document.body.getAttribute('data-theme');
            if (theme === 'light') {
                document.body.removeAttribute('data-theme');
                themeToggle.textContent = '☀️ Light Mode';
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.setAttribute('data-theme', 'light');
                themeToggle.textContent = '🌙 Dark Mode';
                localStorage.setItem('theme', 'light');
            }
        });

        let articles = [];

        async function loadNews() {
            try {
                const res = await fetch('news.json?t=' + Date.now());
                articles = await res.json();
                
                const newsGrid = document.getElementById('newsGrid');
                newsGrid.innerHTML = articles.map((article, index) => `
                    <div class="news-card" onclick="openReader(${index})">
                        <img src="${article.image}" class="news-image" alt="News Image" onerror="this.src='https://images.unsplash.com/photo-1621416894569-0f39ed31d247?w=600&auto=format&fit=crop&q=80'">
                        <div class="news-content-box">
                            <div>
                                <div class="news-title">${article.title}</div>
                            </div>
                            <div class="news-meta"><strong>${article.source}</strong> • ${article.date}</div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('newsGrid').innerHTML = '<p>No news found. Run the GitHub Action once!</p>';
            }
        }

        const readerModal = document.getElementById('readerModal');
        function openReader(index) {
            const article = articles[index];
            document.getElementById('readerImg').src = article.image;
            document.getElementById('readerTitle').textContent = article.title;
            document.getElementById('readerMeta').textContent = `${article.source} • ${article.date}`;
            document.getElementById('readerBody').textContent = article.content;
            document.getElementById('readerExternal').href = article.url;
            readerModal.classList.add('active');
        }

        document.getElementById('closeReader').addEventListener('click', () => readerModal.classList.remove('active'));
        readerModal.addEventListener('click', (e) => {
            if (e.target === readerModal) readerModal.classList.remove('active');
        });

        async function fetchPrices() {
            try {
                const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,cardano&vs_currencies=usd');
                const data = await res.json();
                document.getElementById('cryptoPrices').innerHTML = `
                    <div style="display:flex; justify-content: space-between; margin-bottom: 0.6rem;">
                        <span>BTC</span> <strong>$${data.bitcoin.usd.toLocaleString()}</strong>
                    </div>
                    <div style="display:flex; justify-content: space-between; margin-bottom: 0.6rem;">
                        <span>ETH</span> <strong>$${data.ethereum.usd.toLocaleString()}</strong>
                    </div>
                    <div style="display:flex; justify-content: space-between; margin-bottom: 0.6rem;">
                        <span>SOL</span> <strong>$${data.solana.usd.toLocaleString()}</strong>
                    </div>
                    <div style="display:flex; justify-content: space-between;">
                        <span>ADA</span> <strong>$${data.cardano.usd.toLocaleString()}</strong>
                    </div>
                `;
            } catch (err) {
                document.getElementById('cryptoPrices').textContent = 'Market data offline.';
            }
        }

        loadNews();
        fetchPrices();
    </script>
</body>
</html>
