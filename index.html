<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoFun24 - Automated Crypto Portal</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --modal-bg: rgba(15, 23, 42, 0.85);
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --accent-color: #0284c7;
            --border-color: #e2e8f0;
            --modal-bg: rgba(248, 250, 252, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 2rem;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .widget-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .news-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        .news-card:hover {
            border-color: var(--accent-color);
        }

        .news-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .news-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 1rem;
        }

        .reader-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-bg);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .reader-modal.active {
            display: flex;
        }

        .reader-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            max-width: 800px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-color);
            cursor: pointer;
        }

        .reader-body {
            margin-top: 1.5rem;
            font-size: 1.05rem;
            line-height: 1.8;
        }

        .external-link {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.6rem 1.2rem;
            background-color: var(--accent-color);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ CryptoFun24</div>
        <button class="theme-toggle" id="themeToggle">☀️ Light Mode</button>
    </header>

    <div class="container">
        <main>
            <h2 style="margin-bottom: 1.5rem;">Live Automated Feed</h2>
            <div class="news-grid" id="newsGrid">
                <p>Loading automated news feed...</p>
            </div>
        </main>

        <aside>
            <div class="widget-card">
                <h3>Live Market</h3>
                <div id="cryptoPrices" style="margin-top: 1rem;">
                    Loading market...
                </div>
            </div>
        </aside>
    </div>

    <div class="reader-modal" id="readerModal">
        <div class="reader-content">
            <button class="close-btn" id="closeReader">&times;</button>
            <h1 id="readerTitle">Title</h1>
            <div class="news-meta" id="readerMeta">Source</div>
            <div class="reader-body" id="readerBody">Content...</div>
            <a href="#" target="_blank" class="external-link" id="readerExternal">Read Full Source ↗</a>
        </div>
    </div>

    <script>
        let articles = [];

        async function loadNews() {
            try {
                const res = await fetch('news.json');
                articles = await res.json();
                
                const newsGrid = document.getElementById('newsGrid');
                newsGrid.innerHTML = articles.map((article, index) => `
                    <div class="news-card" onclick="openReader(${index})">
                        <div class="news-title">${article.title}</div>
                        <div class="news-meta"><strong>${article.source}</strong> • ${article.date}</div>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('newsGrid').innerHTML = '<p>Updating feed... Please refresh in a minute.</p>';
            }
        }

        const readerModal = document.getElementById('readerModal');
        function openReader(index) {
            const article = articles[index];
            document.getElementById('readerTitle').textContent = article.title;
            document.getElementById('readerMeta').textContent = `${article.source} • ${article.date}`;
            document.getElementById('readerBody').textContent = article.content;
            document.getElementById('readerExternal').href = article.url;
            readerModal.classList.add('active');
        }

        document.getElementById('closeReader').addEventListener('click', () => readerModal.classList.remove('active'));

        async function fetchPrices() {
            try {
                const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,cardano&vs_currencies=usd');
                const data = await res.json();
                document.getElementById('cryptoPrices').innerHTML = `
                    <div style="display:flex; justify-content: space-between; margin-bottom: 0.6rem;">
                        <span>BTC</span> <strong>$${data.bitcoin.usd.toLocaleString()}</strong>
                    </div>
                    <div style="display:flex; justify-content: space-between; margin-bottom: 0.6rem;">
                        <span>ETH</span> <strong>$${data.ethereum.usd.toLocaleString()}</strong>
                    </div>
                    <div style="display:flex; justify-content: space-between; margin-bottom: 0.6rem;">
                        <span>SOL</span> <strong>$${data.solana.usd.toLocaleString()}</strong>
                    </div>
                    <div style="display:flex; justify-content: space-between;">
                        <span>ADA</span> <strong>$${data.cardano.usd.toLocaleString()}</strong>
                    </div>
                `;
            } catch (err) {
                document.getElementById('cryptoPrices').textContent = 'Market data offline.';
            }
        }

        loadNews();
        fetchPrices();
    </script>
</body>
</html>
